services:
  - type: web
    name: time-collection-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      # Agentes de IA (Caçador, Radar, NEWS FLEX). Sem a chave, o app funciona e os agentes ficam desligados.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HUNTS_PER_DAY
        value: "5"
