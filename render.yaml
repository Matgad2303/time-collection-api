services:
  - type: web
    name: time-collection-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      # IA (Caçador, Deixar avisado, NEWS FLEX e a IA do app). Ordem: Gemini (grátis) → Groq (grátis) → Claude (pago).
      # Sem nenhuma chave, o app funciona e a IA fica desligada.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Usos da IA do app por pessoa por dia (controla o custo)
      - key: AI_PER_DAY
        value: "40"
